esphome:
  name: melpo-package-ci

packages:
  melpo_flood_bridge:
    url: https://github.com/PhiKapJames/ESPHome-Melpo-BLE-Light
    ref: main
    refresh: 1h
    files:
      - path: packages/melpo-flood-bridge.yaml
        vars:
          melpo_flood_key: "31323334"
          melpo_light_id: "1"
          melpo_light_name: "MELPO CI Test"
          melpo_refresh_interval: "15min"

logger:
  level: VERY_VERBOSE
  initial_level: DEBUG

api:
  encryption:
    key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="

ota:
  - platform: esphome

wifi:
  ssid: "MELPO-CI"
  password: "ci-password-123"
