# Public/reusable ESPHome configuration for the MELPO Flood Bridge.
#
# Standard device configuration such as esphome:, wifi:, api:, ota:, logger:,
# and site-specific RF settings belong in the local/private YAML.
#
# Values specific to this FastCon installation are passed in with package vars:
#   melpo_flood_key
#   melpo_light_id
#   melpo_light_name
#   melpo_refresh_interval

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# -----------------------------------------------------------------------------
# BLE
# -----------------------------------------------------------------------------

esp32_ble:

esp32_ble_tracker:
  scan_parameters:
    # FastCon manufacturer data is present in the advertisement itself.
    active: false
    interval: 320ms
    window: 160ms
    continuous: true

  on_ble_manufacturer_data_advertise:
    - manufacturer_id: "FFF0"
      then:
        - lambda: |-
            std::string hex;
            char buf[3];

            for (uint8_t b : x) {
              snprintf(buf, sizeof(buf), "%02X", b);
              hex += buf;
            }

            ESP_LOGVV(
              "melpo.status",
              "FASTCON RX len=%u data=%s",
              (unsigned) x.size(),
              hex.c_str()
            );

# -----------------------------------------------------------------------------
# MELPO-patched FastCon component
# -----------------------------------------------------------------------------

external_components:
  - source: github://PhiKapJames/ESPHome-Melpo-BLE-Light@main
    components: [fastcon]
    refresh: 1h

# -----------------------------------------------------------------------------
# FastCon controller
# -----------------------------------------------------------------------------

fastcon:
  id: fastcon_controller
  mesh_key: ${melpo_flood_key}

  # Upstream defaults are retained except for advertisement duration.
  # 1000 ms is the known-working value validated with the MELPO flood.
  adv_duration: 1000

# -----------------------------------------------------------------------------
# MELPO flood
# -----------------------------------------------------------------------------

light:
  - platform: fastcon
    id: melpo_flood_id_1
    name: ${melpo_light_name}
    light_id: ${melpo_light_id}
    controller_id: fastcon_controller

    supports_cwww: false
    color_interlock: true

    # FastCon has no authoritative state feedback from the flood. Reassert
    # ESPHome/Home Assistant's current state periodically as a safety net.
    refresh_interval: ${melpo_refresh_interval}

    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s
