name: ESPHome MELPO compile

on:
  push:
    branches:
      - main
    paths:
      - "components/fastcon/**"
      - "components/fastcon_group_light/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/esphome-melpo-compile.yml"
  pull_request:
    branches:
      - main
    paths:
      - "components/fastcon/**"
      - "components/fastcon_group_light/**"
      - "tests/**"

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ESPHome
        run: pip install "esphome==2026.9.0"

      - name: Compile multi-light FastCon smoke test
        run: esphome compile tests/melpo-component.yaml
