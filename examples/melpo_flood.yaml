# Example ESPHome device using the MELPO FastCon fork.
# Keep real credentials, mesh keys, and RF tuning in your private YAML/secrets.

esphome:
  name: melpo-flood-bridge
  friendly_name: Melpo Flood Bridge

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: VERY_VERBOSE
  initial_level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Keep deployment-specific RF tuning local/private.
  # output_power: <local value>

esp32_ble:

external_components:
  - source: github://PhiKapJames/ESPHome-Melpo-BLE-Light@main
    components:
      - fastcon
    refresh: 1h

fastcon:
  id: fastcon_controller

  # The upstream default remains 50 ms. 1000 ms is the known-working value
  # for the MELPO flood used during development.
  adv_duration: 1000

light:
  - platform: fastcon
    id: melpo_flood_id_1
    name: "Melpo Flood"
    controller_id: fastcon_controller

    mesh_key: !secret melpo_flood_key
    light_id: 1

    # Initial/default periodic state reassertion.
    refresh_interval: 15min

    # Optional Home Assistant configuration entities for this light.
    # Both values persist on the ESP32 after they are changed in HA.
    refresh_control:
      enabled:
        name: "Melpo Flood Periodic State Refresh"
      interval:
        name: "Melpo Flood Refresh Interval"
        min_value: 1
        max_value: 1440
        step: 1
        mode: box

    supports_cwww: false
    color_interlock: true
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s

  # Additional lights are ordinary additional ESPHome entities and get their
  # own mesh key, interval, and optional HA configuration controls.
  #
