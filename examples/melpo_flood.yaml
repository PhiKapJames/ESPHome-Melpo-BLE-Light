# Example ESPHome device using the MELPO FastCon fork.
# Keep real credentials, mesh keys, and RF tuning in your private YAML/secrets.

esphome:
  name: melpo-flood-bridge
  friendly_name: Melpo Flood Bridge

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: VERY_VERBOSE
  initial_level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Keep deployment-specific RF tuning local/private.
  # output_power: <local value>

esp32_ble:

external_components:
  - source: github://PhiKapJames/ESPHome-Melpo-BLE-Light@main
    components:
      - fastcon
    refresh: 1h

fastcon:
  id: fastcon_controller

  # The upstream default remains 50 ms. 1000 ms is the known-working value
  # for the MELPO flood used during development.
  adv_duration: 1000

light:
  - platform: fastcon
    id: melpo_flood_id_1
    name: "Melpo Flood"
    controller_id: fastcon_controller

    # Per-light FastCon identity/configuration.
    mesh_key: !secret melpo_flood_key
    light_id: 1
    refresh_interval: 15min

    supports_cwww: false
    color_interlock: true
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s

  # Additional lights are ordinary additional ESPHome entities. They may use
  # the same mesh key or a completely different FastCon mesh.
  #
  # - platform: fastcon
  #   id: another_flood
  #   name: "Another Flood"
  #   controller_id: fastcon_controller
  #   mesh_key: !secret another_flood_key
  #   light_id: 1
  #   refresh_interval: 30min
  #   supports_cwww: false
  #   color_interlock: true
  #   restore_mode: RESTORE_DEFAULT_OFF
  #   default_transition_length: 0s
