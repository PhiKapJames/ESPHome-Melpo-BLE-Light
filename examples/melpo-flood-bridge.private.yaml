# LOCAL/PRIVATE ESPHome configuration template.
#
# Copy this outside the public repository and fill in your local RF tuning.

esphome:
  name: melpo-flood-bridge
  friendly_name: Melpo Flood Bridge

packages:
  melpo_flood_bridge:
    url: https://github.com/PhiKapJames/ESPHome-Melpo-BLE-Light
    ref: main
    refresh: 1h
    files:
      - path: packages/melpo-flood-bridge.yaml
        vars:
          melpo_flood_key: !secret melpo_flood_key
          melpo_light_id: "1"
          melpo_light_name: "Melpo Flood"
          melpo_refresh_interval: "15min"

logger:
  level: VERY_VERBOSE
  initial_level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Keep the actual deployment-specific value in your private copy.
  # output_power: <local value>
