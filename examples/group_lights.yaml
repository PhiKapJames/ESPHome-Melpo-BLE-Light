# Example FastCon/brMesh group lights.
# Each group owns its mesh key and refresh interval.

external_components:
  - source: github://PhiKapJames/ESPHome-Melpo-BLE-Light@main
    components:
      - fastcon
      - fastcon_group_light

esp32_ble:

fastcon:
  id: fastcon_controller

light:
  # Six consecutive lamps, IDs 1..6
  - platform: fastcon_group_light
    id: office_group
    name: "Office Light"
    controller_id: fastcon_controller
    mesh_key: "12345678"
    start_light_id: 1
    mask: 0x3F
    refresh_interval: 15min
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

  # Five consecutive lamps, IDs 7..11; this group can use a different mesh.
  - platform: fastcon_group_light
    id: strip_group
    name: "Light Strip"
    controller_id: fastcon_controller
    mesh_key: "87654321"
    start_light_id: 7
    mask: 0x1F
    refresh_interval: 30min
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
