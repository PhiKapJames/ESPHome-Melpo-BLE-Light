# Example FastCon/brMesh group lights.
# Each group owns its mesh key, refresh interval, and optional HA refresh controls.

external_components:
  - source: github://PhiKapJames/ESPHome-Melpo-BLE-Light@main
    components:
      - fastcon
      - fastcon_group_light

esp32_ble:

fastcon:
  id: fastcon_controller

light:
  - platform: fastcon_group_light
    id: office_group
    name: "Office Light"
    controller_id: fastcon_controller
    mesh_key: "12345678"
    start_light_id: 1
    mask: 0x3F
    refresh_interval: 15min
    refresh_control:
      enabled:
        name: "Office Light Periodic State Refresh"
      interval:
        name: "Office Light Refresh Interval"
        min_value: 1
        max_value: 1440
        step: 1
        mode: box
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

  - platform: fastcon_group_light
    id: strip_group
    name: "Light Strip"
    controller_id: fastcon_controller
    mesh_key: "87654321"
    start_light_id: 7
    mask: 0x1F
    refresh_interval: 30min
    refresh_control:
      enabled:
        name: "Light Strip Periodic State Refresh"
      interval:
        name: "Light Strip Refresh Interval"
        min_value: 5
        max_value: 120
        step: 5
        mode: box
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
